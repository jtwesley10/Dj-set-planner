<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Set Planner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .app {
      width: 100%;
      max-width: 760px;
    }

    .logo {
      font-size: 14px;
      color: #a6a6b0;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 48px;
      margin: 0 0 12px;
    }

    h2 {
      margin-top: 0;
    }

    .subtitle {
      font-size: 20px;
      color: #b5b5c0;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    .card {
      background: #16161d;
      border: 1px solid #2a2a35;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    label {
      display: block;
      font-size: 16px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid #3a3a47;
      background: #0f0f14;
      color: white;
      padding: 16px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #8b5cf6;
    }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: white;
    }

    button:hover {
      opacity: 0.92;
    }

    .hint {
      margin-top: 16px;
      color: #777785;
      font-size: 14px;
      line-height: 1.5;
    }

    .set-section {
      border-top: 1px solid #2a2a35;
      padding: 18px 0;
    }

    .set-section:first-of-type {
      border-top: none;
    }

    .set-section h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .set-section p {
      margin: 0;
      color: #b5b5c0;
      line-height: 1.5;
    }

    .request {
      color: #8f8f9c;
      font-style: italic;
      line-height: 1.5;
    }

    #set-results {
      margin-top: 24px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 38px;
      }

      .card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="logo">DJ Set Planner</div>

    <h1>Build better sets.</h1>

    <p class="subtitle">
      Describe the vibe, length, genre, BPM, and energy you want.
    </p>

    <section class="card">
      <label for="set-description">What are you playing?</label>

      <textarea
        id="set-description"
        placeholder="Example: 60-minute late-night riddim set. Start around 145 BPM, keep the energy aggressive, and build toward a huge final 15 minutes."
      ></textarea>

      <button id="build-button">Build My Set</button>

      <p class="hint">
        Describe the kind of set you want and the planner will build a basic set structure.
      </p>
    </section>
  </main>

  <script>
    const button = document.getElementById("build-button");
    const description = document.getElementById("set-description");

    button.addEventListener("click", function () {
      const request = description.value.trim();

      if (!request) {
        alert("Tell me what kind of set you want to build first.");
        return;
      }

      let results = document.getElementById("set-results");

      if (!results) {
        results = document.createElement("section");
        results.id = "set-results";
        results.className = "card";
        document.querySelector(".app").appendChild(results);
      }

      results.innerHTML = `
        <h2>Your Set Plan</h2>

        <p class="request">
          Based on: ${request}
        </p>

        <div class="set-section">
          <h3>1. Opening</h3>
          <p>
            Establish the vibe and give yourself room to build. Start with tracks
            that clearly communicate the sound of the set without using your biggest
            weapons too early.
          </p>
        </div>

        <div class="set-section">
          <h3>2. Build</h3>
          <p>
            Gradually increase energy while keeping transitions smooth. Introduce
            stronger drums, heavier bass, or more recognizable elements.
          </p>
        </div>

        <div class="set-section">
          <h3>3. First Peak</h3>
          <p>
            Bring in one of your strongest tracks and create the first major moment
            of the set.
          </p>
        </div>

        <div class="set-section">
          <h3>4. Reset</h3>
          <p>
            Pull the energy back slightly. Use a track with more space or a different
            feel so the crowd has room before the final push.
          </p>
        </div>

        <div class="set-section">
          <h3>5. Final Peak</h3>
          <p>
            Finish with your heaviest, most memorable, or highest-energy tracks and
            create a clear closing moment.
          </p>
        </div>
      `;

      results.scrollIntoView({
        behavior: "smooth"
      });
    });
  </script>
</body>
</html>
