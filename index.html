<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJ Set Planner</title>
</head>

<body>
  <h1>DJ Set Planner</h1>
  <h2>Build better sets.</h2>

  <p>Describe the set you want to play and we'll help you plan it.</p>

  <label for="set-description">What are you playing?</label>
  <br><br>

  <textarea
    id="set-description"
    rows="6"
    cols="50"
    placeholder="Example: 60-minute late-night riddim set. Start around 145 BPM and build toward an aggressive finish."
  ></textarea>

  <br><br>

  <button>Build My Set</button>
</body>
</html>
