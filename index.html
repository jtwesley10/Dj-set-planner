<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Set Planner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .app {
      width: 100%;
      max-width: 760px;
    }

    .logo {
      font-size: 14px;
      color: #a6a6b0;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 48px;
      margin: 0 0 12px;
    }

    .subtitle {
      font-size: 20px;
      color: #b5b5c0;
      margin-bottom: 36px;
    }

    .card {
      background: #16161d;
      border: 1px solid #2a2a35;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    label {
      display: block;
      font-size: 16px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid #3a3a47;
      background: #0f0f14;
      color: white;
      padding: 16px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #8b5cf6;
    }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: white;
    }

    button:hover {
      opacity: 0.92;
    }

    .hint {
      margin-top: 16px;
      color: #777785;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<script>
  const button = document.getElementById("build-button");
  const description = document.getElementById("set-description");

  button.addEventListener("click", function () {
    const request = description.value.trim();

    if (!request) {
      alert("Tell me what kind of set you want to build first.");
      return;
    }

    let results = document.getElementById("set-results");

    if (!results) {
      results = document.createElement("section");
      results.id = "set-results";
      results.className = "card";
      results.style.marginTop = "24px";
      document.querySelector(".app").appendChild(results);
    }

    results.innerHTML = `
      <h2>Your Set Plan</h2>
      <p style="color:#b5b5c0;">Based on: ${request}</p>

      <div style="margin-top:24px;">
        <p><strong>1. Opening</strong><br>
        Establish the vibe and give yourself room to build.</p>

        <p><strong>2. Build</strong><br>
        Gradually increase energy while keeping transitions smooth.</p>

        <p><strong>3. First Peak</strong><br>
        Bring in one of your strongest tracks and create the first big moment.</p>

        <p><strong>4. Reset</strong><br>
        Pull the energy back slightly so the next peak hits harder.</p>

        <p><strong>5. Final Peak</strong><br>
        Finish with your heaviest or most memorable tracks.</p>
      </div>
    `;

    results.scrollIntoView({ behavior: "smooth" });
  });
</script>
</body>
</html>
